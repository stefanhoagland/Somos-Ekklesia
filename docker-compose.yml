# Somos Ekklesia en Unraid (plugin "Docker Compose Manager") o en cualquier servidor con Docker.
# Copia .env.example como .env, rellénalo y ejecuta: docker compose up -d --build

services:
  app:
    build: https://github.com/stefanhoagland/Somos-Ekklesia.git#main
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ekklesia:${POSTGRES_PASSWORD}@db:5432/ekklesia
      # Pon 1 solo si entras por http://IP-del-servidor sin HTTPS.
      COOKIE_INSEGURA: ${COOKIE_INSEGURA:-0}
    ports:
      - "${PUERTO:-3000}:3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ekklesia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ekklesia
    volumes:
      - ${DATOS:-/mnt/user/appdata/somos-ekklesia}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekklesia -d ekklesia"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Copia de seguridad diaria de la base de datos (guarda 7 días, 4 semanas y 6 meses).
  copias:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ekklesia
      POSTGRES_USER: ekklesia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ${COPIAS:-/mnt/user/backups/somos-ekklesia}:/backups

  # Publica el sitio en internet sin abrir puertos (Cloudflare Tunnel).
  # Se activa con: docker compose --profile tunel up -d
  tunel:
    image: cloudflare/cloudflared:2025.8.1
    restart: unless-stopped
    profiles: ["tunel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
