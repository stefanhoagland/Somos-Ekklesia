name: Publicar imagen Docker

# Cada cambio en main publica ghcr.io/stefanhoagland/somos-ekklesia:latest,
# que es la imagen que usa Unraid.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/stefanhoagland/somos-ekklesia:latest
            ghcr.io/stefanhoagland/somos-ekklesia:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/stefanhoagland/Somos-Ekklesia
          cache-from: type=gha
          cache-to: type=gha,mode=max
